name: Archive Nikkei 1-minute prices
on:
  schedule:
    # Every 15 minutes during a broad JST daytime window (UTC 00:00–07:45).
    # Yahoo data can be delayed. Each run refetches the last 5 days to repair gaps.
    - cron: "*/15 0-7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nikkei-minute-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "pandas>=2.1,<3" "yfinance>=0.2.50,<2"
      - run: python scripts/archive_intraday.py
      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/1m data/daily_extrema.csv
          if ! git diff --cached --quiet; then
            git commit -m "Archive Nikkei minute bars"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
